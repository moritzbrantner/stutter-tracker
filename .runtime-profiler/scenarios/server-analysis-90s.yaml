schema_version: runtime-profiler/scenario/v1
id: stutter-tracker-server-analysis-90s
target:
  type: command
  program: bun
  # Needs STUTTER_NATIVE_WORKER pointing at a release compute-worker; add --no-measure for the
  # unmeasured baseline. The script prints per-request wall times (the domain metrics).
  args: ["apps/server/src/profile-analysis.ts", "--duration-seconds", "90", "--iterations", "5"]
  working_directory: ../..
run:
  warmup_iterations: 1
  measurement_iterations: 5
  timeout_seconds: 120
collectors:
  - process
