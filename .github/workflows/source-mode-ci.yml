name: Source mode CI

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-mode:
    name: exact capability source graph
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
    steps:
      - name: Require private source token
        run: |
          if [ -z "$GH_PACKAGES_TOKEN" ]; then
            echo "GH_PACKAGES_TOKEN must have contents:read access to audio-analysis, nlp-stack, moenarch-foundation, and coding-tooling." >&2
            exit 1
          fi

      - name: Check out candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request_target' && format('refs/pull/{0}/merge', github.event.pull_request.number) || github.sha }}
          persist-credentials: false

      - name: Configure private source auth
        run: |
          git config --global url."https://x-access-token:${GH_PACKAGES_TOKEN}@github.com/moritzbrantner/".insteadOf "https://github.com/moritzbrantner/"

      - name: Check out source-dependency tooling
        uses: actions/checkout@v5
        with:
          repository: moritzbrantner/coding-tooling
          ref: f9133fe3ca885c2538d2fc92cd52427f4b7ab738
          token: ${{ secrets.GH_PACKAGES_TOKEN }}
          path: .source/coding-tooling
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Activate exact source graph
        env:
          CODING_TOOLING_DIR: ${{ github.workspace }}/.source/coding-tooling
        run: |
          bash scripts/source-deps activate
          bash scripts/source-deps status

      - name: Verify Rust application
        working-directory: apps/desktop/src-tauri
        run: |
          cargo fmt -- --check
          cargo check
          cargo clippy --all-targets -- -D warnings
          cargo test

      - name: Deactivate source graph
        if: ${{ always() && hashFiles('scripts/source-deps') != '' }}
        env:
          CODING_TOOLING_DIR: ${{ github.workspace }}/.source/coding-tooling
        run: bash scripts/source-deps deactivate || true
