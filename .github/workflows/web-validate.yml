name: Web Validate

on:
  pull_request:
    paths:
      - .github/workflows/web-validate.yml
      - apps/web/**
      - packages/compute-client/**
      - packages/shared/**
      - package.json
      - bun.lock
      - turbo.json
  push:
    branches: [main]
    paths:
      - .github/workflows/web-validate.yml
      - apps/web/**
      - packages/compute-client/**
      - packages/shared/**
      - package.json
      - bun.lock
      - turbo.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check web formatting
        run: bun --filter @stutter-tracker/web format:check
      - name: Build web app
        run: bun run build:web
      - name: Run web unit tests
        run: bun run test:unit
      - name: Run web integration tests
        run: bun run test:integration
