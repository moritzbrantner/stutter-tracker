name: Foundation Plan

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out consumer repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Check out coding-tooling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: moritzbrantner/coding-tooling
          ref: 0402168aca8ada58b7fe2cb200723292e7ccd7be
          path: .tooling/coding-tooling

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0

      - name: Install coding-tooling dependencies
        run: cd .tooling/coding-tooling && bun install --frozen-lockfile

      - name: Plan repository foundation
        run: |
          set -euo pipefail
          mkdir -p .artifacts/foundation-plan
          bun .tooling/coding-tooling/src/cli.ts bootstrap plan \
            --root . \
            --json > .artifacts/foundation-plan/plan.json
          cat .artifacts/foundation-plan/plan.json

      - name: Upload foundation plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: foundation-plan
          path: .artifacts/foundation-plan/plan.json
          if-no-files-found: error
          retention-days: 1
