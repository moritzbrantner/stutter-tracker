name: One-shot repository hardening

on:
  push:
    branches:
      - chore/harden-repository
    paths:
      - .github/workflows/hardening-codemod.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: chore/harden-repository

      - name: Apply bounded hardening edits
        run: python3 scripts/harden-repository-once.py

      - name: Verify patch shape
        run: |
          git diff --check
          git status --short

      - name: Commit hardening edits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden shared utility ownership and request tests"
          git push origin HEAD:chore/harden-repository
