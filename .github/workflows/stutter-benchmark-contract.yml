name: Stutter benchmark contract

on:
  pull_request:
    paths:
      - "packages/stutter-bench/**"
      - "package.json"
      - ".github/workflows/stutter-benchmark-contract.yml"
  push:
    branches:
      - main
    paths:
      - "packages/stutter-bench/**"
      - "package.json"
      - ".github/workflows/stutter-benchmark-contract.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Run deterministic benchmark harness tests
        run: bun test packages/stutter-bench/src/index.test.ts
