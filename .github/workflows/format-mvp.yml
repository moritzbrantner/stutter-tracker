name: Format MVP Slice

on:
  push:
    branches:
      - feat/mvp-session-progress

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mvp-session-progress
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Format web sources
        run: bun --filter @stutter-tracker/web format
      - name: Commit formatter output
        run: |
          if git diff --quiet -- apps/web; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web
          git commit -m "style(web): apply formatter"
          git push origin HEAD:feat/mvp-session-progress
